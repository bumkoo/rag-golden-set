[project]
name = "golden-set"
version = "0.1.0"
description = "pdf/pptx/docx/txt 문서를 같은 형태의 Document 리스트로 읽고 추출 품질을 숫자로 검증한다"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.0",
    "docx2txt>=0.9",
    "pymupdf>=1.24.3",
    "python-pptx>=1.0",
]

[project.optional-dependencies]
# 비교용 대안 로더 (cli compare)
compare = [
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "unstructured[pptx]>=0.16; python_version < '3.14'",
]
# 골든 후보 생성기 (cli ping, generate). 확인한 버전: ragas 0.4.4, deepeval 4.3.4, openai 1.109.1 (NOTES.md 8장)
generate = [
    "openai>=1.109",
    "ragas>=0.4.4,<0.5",     # 내부 구조(변환 실행 계획, 합성기, tqdm 막대)에 기대므로 상한을 둔다
    "rapidfuzz>=3.0",     # ragas OverlapScoreBuilder가 쓰는데 ragas 기본 의존성에는 없다
    "deepeval>=4.3.4,<4.4",  # 위와 같다 (Synthesizer의 _progress 인자, 스키마 이름)
]
dev = [
    "pytest>=8",
    "python-docx>=1.1",   # docx 픽스처 생성에 필요
    "striprtf>=0.0.26",   # 실제 문서 검증에서 RTF 파서 대조용
    "golden-set[generate]",  # 생성기 변환·실패 처리 테스트는 실제 도구 객체로 한다
]

[project.scripts]
golden-set = "golden_set.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/golden_set"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# deepeval은 pytest 플러그인을 자동 등록한다. 우리 테스트에는 필요 없고, 시작 때 .deepeval/ 폴더를 만들며 사용 통계 모듈을 import하므로 끈다.
addopts = "-p no:deepeval"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:.*langchain-community.*:DeprecationWarning",  # ragas가 import하는 langchain_community의 경고
]
